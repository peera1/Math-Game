<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef6ff">
<title>כמה כסף יש לי? – משחק מטבעות לכיתה א׳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#24334a;--muted:#66758a;--blue:#5667ed;--blue-dark:#3f4fd0;--line:#e4eaf3;--shadow:0 12px 35px #25416b18}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 5%,#dff4ff 0,transparent 35%),radial-gradient(ellipse at 90% 30%,#fff0d9 0,transparent 30%),#f5f8ff;color:var(--ink);font-family:Rubik,Arial,sans-serif}.wrap{width:min(760px,100%);margin:auto;padding:20px 16px 40px}.home{display:inline-flex;margin:0 0 14px;color:#4255cf;text-decoration:none;font-weight:700}.card{background:#ffffffed;border:1px solid #fff;border-radius:26px;padding:clamp(20px,5vw,36px);box-shadow:var(--shadow)}.center{text-align:center}.hero{font-size:clamp(48px,12vw,76px);line-height:1.2}.title{font-size:clamp(28px,7vw,40px);margin:8px 0}.sub{color:var(--muted);font-size:17px;line-height:1.6;margin:8px 0 22px}.label{font-weight:800;text-align:right;margin:17px 0 8px}.input{display:block;width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 15px;font:inherit;font-size:17px;background:#fff;color:var(--ink);outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #5667ed20}.amount-help{display:block;text-align:right;color:var(--muted);font-size:14px;margin-top:7px}.error{min-height:22px;text-align:right;color:#ae263b;font-size:14px;font-weight:700;margin-top:5px}.options{display:flex;flex-wrap:wrap;gap:9px}.opt{flex:1 1 130px;min-height:46px;border:2px solid var(--line);border-radius:14px;background:white;color:var(--ink);font:inherit;font-weight:700;padding:9px 12px;cursor:pointer}.opt.on{background:#eef0ff;border-color:var(--blue);color:#3545c2}.start,.check,.next-question,.again{border:0;border-radius:16px;background:var(--blue);color:#fff;font:inherit;font-size:19px;font-weight:800;padding:14px 22px;cursor:pointer;box-shadow:0 5px 0 var(--blue-dark)}.start{width:100%;margin-top:24px}button:focus-visible{outline:4px solid #ffca55;outline-offset:3px}.hint,.icon{border:0;border-radius:12px;background:#fff4d9;color:#79520b;padding:10px 13px;font:inherit;font-weight:700;cursor:pointer}.icon{background:#f1f3f8;color:#59667a}.top{display:flex;align-items:center;gap:11px}.top b{flex:1;text-align:center;font-size:18px}.hearts{white-space:nowrap;letter-spacing:2px;font-size:21px}.dots{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:21px 0}.dot{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#eef1f7;color:#78859a;font-size:13px;font-weight:700}.dot.current{background:#e8eaff;color:#3545c2;box-shadow:0 0 0 3px #5667ed35}.dot.done{background:#dff7e9;color:#117947}.bubble{min-height:54px;display:grid;place-items:center;text-align:center;border-radius:16px;background:#f1f5ff;padding:12px 15px;font-weight:700;font-size:18px;line-height:1.45}.bubble.good{background:#e1f8eb;color:#087343;animation:pop .35s ease}.bubble.bad{background:#ffeaec;color:#a62339;animation:shake .3s ease}.bubble.neutral{background:#fff4d9;color:#79520b}.reward-strip{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0 8px}.reward-card{display:flex;align-items:center;gap:8px;min-width:125px;padding:8px 12px;border-radius:14px;background:linear-gradient(180deg,#fff8de,#ffe29d);border:2px solid #f4c14a;color:#7a5600;box-shadow:0 5px 15px #dd9c0038}.reward-icon{font-size:26px}.reward-text{font-size:13px;font-weight:800}.reward-text small{display:block;font-size:11px}.board{margin:18px 0 14px;padding:18px 14px 12px;border-radius:20px;background:linear-gradient(180deg,#f3fbff,#eaf5ff);border:1px solid #dceeff;text-align:center}.wallet{font-size:17px;font-weight:800;color:#526174}.coins{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;min-height:75px;margin:13px 0}.coin{position:relative;display:grid;place-items:center;width:59px;height:59px;border-radius:50%;border:3px solid #d18a24;background:radial-gradient(circle at 35% 30%,#fff5b4,#f8cf59 68%,#e8a82e);color:#69420a;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 4px 0 #c68222}.coin.counted{outline:4px solid #6c79f4;outline-offset:2px}.coin.spent{opacity:.35;filter:grayscale(.8);cursor:default;box-shadow:none}.coin.spent:after{content:'×';position:absolute;font-size:43px;color:#9e3040}.foot{color:var(--muted);font-size:14px}.answerline{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0 12px;font-size:18px;font-weight:700}.answer{min-width:72px;min-height:58px;display:grid;place-items:center;border:2px dashed #b9c3d4;border-radius:15px;background:#fff;font-size:28px;color:var(--blue)}.answer.correct{border-style:solid;border-color:#51b77f;background:#e8f9ef;color:#087343}.answer.wrong{border-style:solid;border-color:#ed8d9b;background:#fff0f1;color:#ae263b}.keys{display:grid;grid-template-columns:repeat(5,minmax(45px,1fr));gap:8px;max-width:480px;margin:0 auto 15px}.key{min-height:48px;border:2px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font:inherit;font-size:20px;font-weight:800;cursor:pointer}.key.erase{font-size:16px;color:#66758a}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.check,.next-question{min-width:min(240px,100%)}.check:disabled{background:#aeb6c7;box-shadow:0 5px 0 #929bad;cursor:not-allowed}.next-question{background:#15945d;box-shadow:0 5px 0 #0b7044}.result h2{font-size:32px;margin:10px 0}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0}.stat{min-width:120px;padding:14px;background:#f2f5ff;border-radius:15px}.stat b{display:block;font-size:25px;color:#4052d2;margin-bottom:4px}.again{margin-top:8px}#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}@keyframes pop{50%{transform:scale(1.025)}}@keyframes shake{25%{transform:translateX(7px)}50%{transform:translateX(-7px)}75%{transform:translateX(4px)}}@media(max-width:480px){.wrap{padding:12px 10px 28px}.card{border-radius:21px;padding:19px 15px}.top{gap:7px}.coin{width:52px;height:52px}.keys{grid-template-columns:repeat(4,1fr)}.actions>*{width:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<main class="wrap">
<a class="home" href="../index.html">🏠 חזרה לכל המשחקים</a>
<section id="setup" class="card center">
  <div class="hero" aria-hidden="true">🐷🪙</div><h1 class="title">כמה כסף יש לי?</h1>
  <p class="sub">סופרים מטבעות ומגלים כמה כסף יש בארנק. במשחק יש חיווי ברור על הצלחה וכישלון, פרסים וקונפטי!</p>
  <div class="label">איך קוראים לך? (לא חובה)</div><input id="kidName" class="input" maxlength="20" autocomplete="off" placeholder="השם שלי">
  <div class="label">מה נתרגל?</div><div class="options" id="modes"><button class="opt on" data-val="mixed" type="button">🔀 מעורב</button><button class="opt" data-val="add" type="button">➕ חיבור</button><button class="opt" data-val="sub" type="button">➖ חיסור</button></div>
  <div class="label">אילו מטבעות?</div><div class="options" id="levels"><button class="opt" data-val="easy" type="button">🙂 קל: 1 ו־2 ₪</button><button class="opt" data-val="medium" type="button">😎 בינוני: עד 5 ₪</button><button class="opt on" data-val="all" type="button">🚀 הכול: עד 10 ₪</button></div>
  <div class="label"><label for="maxAmount">מה הסכום המקסימלי בארנק? התלמיד/ה יקלידו</label></div>
  <input id="maxAmount" class="input" type="number" min="10" max="50" step="1" value="15" inputmode="numeric" required aria-describedby="amountHelp amountError" placeholder="הקלידו מספר בין 10 ל־50">
  <small id="amountHelp" class="amount-help">הקלידו סכום שלם בין 10 ל־50 שקלים.</small><div id="amountError" class="error" role="alert" aria-live="polite"></div>
  <button id="start" class="start" type="button">יוצאים לדרך! 🚀</button>
</section>
<section id="play" class="card" hidden>
  <div class="top"><button class="icon" id="quit" type="button" aria-label="חזרה להגדרות">✖</button><b id="qcount"></b><span id="hearts" class="hearts" aria-label="לבבות"></span></div>
  <div class="dots" id="dots" aria-label="התקדמות"></div><div id="bubble" class="bubble" aria-live="assertive"></div><div id="rewards" class="reward-strip" aria-live="polite"></div>
  <div class="board"><div class="wallet">👛 הארנק</div><div id="coins" class="coins" aria-label="מטבעות הארנק"></div><div class="foot" id="counter">אפשר לגעת במטבעות כדי לספור</div></div>
  <div class="answerline"><span id="ask">בארנק יש</span><div id="answer" class="answer" aria-live="polite">?</div><span>₪</span></div><div id="keys" class="keys" aria-label="לוח מספרים"></div>
  <div class="actions"><button id="check" class="check" type="button" disabled>בדיקה ✓</button><button id="nextQuestion" class="next-question" type="button" hidden>לשאלה הבאה ←</button><button id="hint" class="hint" type="button">💡 רמז</button></div>
</section>
<section id="result" class="card center result" hidden><div class="hero" aria-hidden="true">🐷🎉</div><h2 id="resultTitle">כל הכבוד!</h2><p id="resultText" class="sub"></p><div id="stats" class="stats"></div><button id="again" class="again" type="button">משחקים שוב 🔄</button></section>
</main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),TOTAL=10,MAX_MISTAKES=5,VALUES={easy:[1,2],medium:[1,2,5],all:[1,2,5,10]};
let mode='mixed',level='all',name='',questions=[],index=0,mistakes=0,selected='',counted=[],solved=0,firstTry=0,wrongOnQuestion=0,hintUsed=false,history=[],questionLocked=false,rewardCards=[];
const pick=a=>a[Math.floor(Math.random()*a.length)],sum=a=>a.reduce((x,y)=>x+y,0),money=n=>`${n} ₪`;
function options(id,cb){$(id).addEventListener('click',e=>{const b=e.target.closest('[data-val]');if(!b)return;$(id).querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.val)})}
options('#modes',v=>mode=v);options('#levels',v=>level=v);
function renderRewards(){ $('#rewards').innerHTML=rewardCards.map(c=>`<div class="reward-card" aria-label="${c.title}"><span class="reward-icon">${c.icon}</span><span class="reward-text">${c.title}<small>${c.text}</small></span></div>`).join('') }
function makeRound(max){const values=VALUES[level],combinations=[];function build(start,coins,total){if(coins.length>=2)combinations.push(coins.slice());if(coins.length===5)return;for(let i=start;i<values.length;i++){if(total+values[i]<=max)build(i,coins.concat(values[i]),total+values[i])}}build(0,[],0);const addPool=combinations.map(coins=>({type:'add',coins,removed:[],answer:sum(coins)})),subPool=[];combinations.forEach(coins=>{for(let i=0;i<coins.length;i++){for(let count=1;count<=2;count++){const removed=count===1?[coins[i]]:i+1<coins.length?[coins[i],coins[i+1]]:null;if(!removed)continue;const answer=sum(coins)-sum(removed);if(answer>0)subPool.push({type:'sub',coins,removed,answer})}}});const types=Array.from({length:TOTAL},(_,i)=>mode==='mixed'?(i%2===0?'add':'sub'):mode),pools={add:addPool,sub:subPool};return types.map(type=>{const pool=pools[type].length?pools[type]:addPool,q=pick(pool);return {...q,coins:q.coins.slice(),removed:q.removed.slice()}})}
function start(){const field=$('#maxAmount'),raw=field.value.trim(),max=Number(raw),error=$('#amountError');if(raw===''||!Number.isInteger(max)||max<10||max>50){error.textContent='יש להקליד מספר שלם בין 10 ל־50.';field.setAttribute('aria-invalid','true');field.focus();return}error.textContent='';field.removeAttribute('aria-invalid');name=$('#kidName').value.trim().slice(0,20);questions=makeRound(max);index=mistakes=solved=firstTry=0;history=[];rewardCards=[];renderRewards();$('#setup').hidden=true;$('#result').hidden=true;$('#play').hidden=false;render();$('#play').scrollIntoView({behavior:'smooth',block:'start'})}
function renderDots(){$('#dots').innerHTML=questions.map((_,i)=>`<span class="dot ${i===index?'current':history[i]?'done':''}" aria-label="שאלה ${i+1}${history[i]?' הושלמה':''}">${history[i]?'✓':i+1}</span>`).join('')}
function render(){const q=questions[index];selected='';counted=[];wrongOnQuestion=0;hintUsed=false;questionLocked=false;$('#qcount').textContent=`שאלה ${index+1} מתוך ${TOTAL}`;$('#hearts').textContent='❤️'.repeat(Math.max(0,MAX_MISTAKES-mistakes))+'🤍'.repeat(mistakes);$('#hearts').setAttribute('aria-label',`${MAX_MISTAKES-mistakes} ניסיונות נותרו`);renderDots();$('#bubble').className='bubble';$('#bubble').textContent=`${name?name+' — ':''}${q.type==='add'?'כמה כסף יש בארנק?':'אחרי שקנינו, כמה כסף נשאר בארנק?'}`;$('#ask').textContent=q.type==='add'?'בארנק יש':'נשאר בארנק';$('#coins').innerHTML=q.coins.map((v,i)=>`<button class="coin" type="button" data-i="${i}" aria-label="מטבע ${v} שקלים">${v}₪</button>`).join('');const spent=q.removed.slice();[...$('#coins').children].forEach((el,i)=>{const at=spent.indexOf(q.coins[i]);if(at!==-1){el.classList.add('spent');el.disabled=true;el.setAttribute('aria-label',`מטבע ${q.coins[i]} שקלים שהוצא`);spent.splice(at,1)}});$('#coins').onclick=e=>{const b=e.target.closest('.coin');if(!b||questionLocked||b.classList.contains('spent'))return;const i=+b.dataset.i;counted=counted.includes(i)?counted.filter(x=>x!==i):counted.concat(i);b.classList.toggle('counted',counted.includes(i));$('#counter').textContent=counted.length?`ספרנו ${counted.length} מטבעות`:'אפשר לגעת במטבעות כדי לספור'};$('#counter').textContent='אפשר לגעת במטבעות כדי לספור';$('#answer').textContent='?';$('#answer').className='answer';$('#check').hidden=false;$('#check').disabled=true;$('#nextQuestion').hidden=true;$('#hint').disabled=false;renderKeys()}
function renderKeys(){const keys=[1,2,3,4,5,6,7,8,9,'⌫',0,'נקה'];$('#keys').innerHTML=keys.map(k=>`<button type="button" class="key ${typeof k==='string'?'erase':''}" data-key="${k}" aria-label="${k==='⌫'?'מחיקה':k==='נקה'?'ניקוי התשובה':k}">${k}</button>`).join('');$('#keys').onclick=e=>{const b=e.target.closest('[data-key]');if(!b||questionLocked)return;const k=b.dataset.key;if(k==='נקה')selected='';else if(k==='⌫')selected=selected.slice(0,-1);else if(selected.length<2)selected+=k;$('#answer').textContent=selected||'?';$('#check').disabled=selected==='';$('#answer').className='answer'}}
function feedback(text,type){$('#bubble').className=`bubble ${type}`;$('#bubble').textContent=text}
function confetti(amount=100){const c=$('#confetti'),ctx=c.getContext('2d');if(!ctx)return;const dpr=Math.min(devicePixelRatio||1,2);c.width=innerWidth*dpr;c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx.scale(dpr,dpr);const colors=['#ff5268','#ffd447','#4ecb8d','#6480ff','#bd65dc','#ff914d'],pieces=Array.from({length:amount},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.3,w:5+Math.random()*8,h:7+Math.random()*10,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,s:(Math.random()-.5)*.2,color:pick(colors)}));let frame=0;function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.s;p.vy+=.035;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});if(++frame<115&&pieces.some(p=>p.y<innerHeight+20))requestAnimationFrame(draw);else ctx.clearRect(0,0,innerWidth,innerHeight)}requestAnimationFrame(draw)}
function showContinue(label){$('#check').hidden=true;$('#nextQuestion').textContent=label;$('#nextQuestion').hidden=false;$('#nextQuestion').focus({preventScroll:true})}
function nextQuestion(){if($('#nextQuestion').hidden)return;$('#nextQuestion').hidden=true;if(mistakes>=MAX_MISTAKES||index+1>=TOTAL)finish();else{index++;render()}}
function awardPrize(){const icons=['🏅','🎖️','🥇','🏆','🎁'],icon=icons[Math.min(rewardCards.length,icons.length-1)];rewardCards.push({icon,title:`פרס ${rewardCards.length+1}`,text:'3 הצלחות'});renderRewards();feedback(`איזה יופי! קיבלת ${icon} — פרס אחרי 3 הצלחות!`,'good');confetti(90)}
function check(){if(selected===''||questionLocked)return;const q=questions[index];if(Number(selected)===q.answer){questionLocked=true;solved++;if(!wrongOnQuestion)firstTry++;history[index]=true;$('#answer').classList.add('correct');$('#answer').textContent=`${q.answer} ✓`;if(solved%3===0)awardPrize();else{feedback(pick(['נכון מאוד! כל הכבוד! 🎉','איזה יופי, הצלחת! 🌟','תשובה נכונה! את/ה אלוף/ה! 🥳','בדיוק! הידד! 🎊']),'good');confetti()}showContinue(index+1===TOTAL||mistakes>=MAX_MISTAKES?'לסיום המשחק ←':'לשאלה הבאה ←');renderDots();return}wrongOnQuestion++;mistakes++;$('#answer').classList.add('wrong');$('#answer').textContent=`${selected} ✗`;if(mistakes>=MAX_MISTAKES){questionLocked=true;feedback(`לא הפעם 💛 התשובה הנכונה היא ${money(q.answer)}. ממשיכים לסיכום!`,'bad');$('#answer').textContent=`${q.answer} ₪`;showContinue('לסיכום המשחק ←')}else{feedback(pick(['לא בדיוק — נסו לספור שוב, אתם יכולים! 💪','כמעט! בדקו שוב את המטבעות ונסו פעם נוספת.','לא נורא, טעויות עוזרות ללמוד! נסו שוב 🌱']),'bad');selected='';$('#check').disabled=true;setTimeout(()=>{if(!questionLocked)$('#answer').textContent='?'},900)}$('#hearts').textContent='❤️'.repeat(Math.max(0,MAX_MISTAKES-mistakes))+'🤍'.repeat(mistakes);$('#hearts').setAttribute('aria-label',`${MAX_MISTAKES-mistakes} ניסיונות נותרו`)}
function hint(){if(hintUsed||questionLocked)return;hintUsed=true;const q=questions[index];$('#hint').disabled=true;feedback(q.type==='sub'?'רמז: המטבעות המסומנים באפור כבר יצאו מהארנק. ספרו את השאר.':'רמז: געו בכל מטבע בזמן הספירה, ואז חברו את הערכים.','neutral')}
function finish(){const score=Math.max(0,firstTry*10+(solved-firstTry)*5),title=mistakes>=MAX_MISTAKES?'כל הכבוד על המאמץ! 💛':solved===TOTAL?'אליפות, ענית על הכול! 🏆':'סיימנו את המשחק! 🎉';$('#play').hidden=true;$('#result').hidden=false;$('#resultTitle').textContent=name?`${title} ${name}`:title;$('#resultText').textContent=solved===TOTAL?'תרגלת חיבור וחיסור של כסף. ממשיכים להשתפר בכל משחק!':'כל שאלה שפתרת היא הצלחה, וכל ניסיון עוזר ללמוד. רוצים לנסות שוב?';$('#stats').innerHTML=`<div class="stat"><b>${solved}</b>תשובות נכונות</div><div class="stat"><b>${firstTry}</b>בניסיון הראשון</div><div class="stat"><b>${score}</b>נקודות</div>`;if(solved)confetti(180);$('#result').scrollIntoView({behavior:'smooth',block:'start'})}
$('#maxAmount').addEventListener('input',()=>{if($('#maxAmount').value.trim()==='')return;const n=Number($('#maxAmount').value);if(Number.isInteger(n)&&n>=10&&n<=50){$('#amountError').textContent='';$('#maxAmount').removeAttribute('aria-invalid')}});$('#start').onclick=start;$('#again').onclick=()=>{$('#result').hidden=true;$('#setup').hidden=false;$('#kidName').focus()};$('#check').onclick=check;$('#nextQuestion').onclick=nextQuestion;$('#hint').onclick=hint;$('#quit').onclick=()=>{$('#play').hidden=true;$('#setup').hidden=false};$('#kidName').addEventListener('keydown',e=>{if(e.key==='Enter')start()});document.addEventListener('keydown',e=>{if($('#play').hidden||questionLocked)return;if(e.key==='Enter'&&!$('#check').hidden&&!$('#check').disabled)check();else if(/^[0-9]$/.test(e.key)){const key=$(`#keys [data-key="${e.key}"]`);if(key)key.click()}else if(e.key==='Backspace')$('#keys [data-key="⌫"]').click()});
})();
</script>
</body>
</html>
