<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8f5ff">
<title>כמה כסף יש לי? – משחק מטבעות לכיתה א׳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b3a4a;--muted:#6b7b8c;--primary:#5b6cff;--primary-dark:#3f4fd8;--good:#1fae6b;--shadow:0 6px 20px #283c5a20}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;padding:14px;font-family:Rubik,Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,#e8f5ff,#fff3df)}button,input{font:inherit}button{border:0;cursor:pointer;touch-action:manipulation}.wrap{max-width:760px;margin:auto}.home{display:inline-block;margin:4px 0 12px;color:#3f4fd8;font-weight:700;text-decoration:none}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);margin-bottom:12px}.center{text-align:center}.hero{font-size:58px}.title{font-size:clamp(28px,6vw,38px);margin:4px}.sub{color:var(--muted);line-height:1.55}.label{font-weight:700;margin:16px 0 8px}.input{max-width:330px;width:100%;height:48px;border:2px solid #d5dce8;border-radius:14px;text-align:center;padding:8px}.options{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.opt{padding:10px 14px;border:3px solid transparent;border-radius:16px;background:#f3f6fb;font-weight:700;min-height:48px}.opt.on{border-color:var(--primary);background:#fff}.start{display:block;width:min(100%,520px);margin:18px auto 0;padding:16px;border-radius:18px;color:#fff;background:var(--primary);box-shadow:0 5px 0 var(--primary-dark);font-size:21px;font-weight:800}.top{display:flex;align-items:center;justify-content:space-between;gap:5px}.icon{width:44px;height:44px;border-radius:14px;background:#f3f6fb}.hearts{font-size:24px}.dots{display:flex;justify-content:center;gap:5px;margin:12px}.dot{width:23px;height:23px;border:2px solid #d8dee8;border-radius:50%;display:grid;place-items:center;background:white;font-size:12px}.dot.current{border-color:var(--primary);color:var(--primary)}.dot.done{background:var(--good);color:white;border-color:var(--good)}.bubble{background:#eaf0ff;padding:14px;border-radius:18px;font-weight:700;text-align:center;min-height:48px}.board{margin:14px 0;background:linear-gradient(#fffdf7,#fff4e0);border:3px dashed #efbf78;border-radius:20px;padding:10px}.wallet{text-align:center;color:#9b5f22;font-weight:700}.coins{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;min-height:110px;padding:12px 0}.coin{width:clamp(56px,15vw,86px);height:clamp(56px,15vw,86px);border:5px solid #c5ccd3;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#d5dbe2 58%,#909ba6);box-shadow:0 4px 6px #0003;font-size:23px;font-weight:800;position:relative}.coin.gold{background:radial-gradient(circle at 30% 25%,#fff6c4,#f3c23e 58%,#c48b14);border-color:#b17b18}.coin.spent{opacity:.42;filter:grayscale(1);text-decoration:line-through}.coin.counted{outline:5px solid #ffd23f;transform:scale(1.08)}.foot{display:flex;justify-content:space-between;align-items:center;gap:8px}.hint{border-radius:20px;background:#fff2dc;color:#8a4b00;padding:9px 14px;font-weight:700}.answerline{display:flex;justify-content:center;align-items:center;gap:10px;font-size:20px;font-weight:700}.answer{min-width:76px;height:58px;border:3px solid #cfd6e3;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:34px;color:#3f4fd8}.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;max-width:520px;margin:14px auto}.key{height:50px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #d3dae6;font-size:22px;font-weight:800}.key.sel{background:var(--primary);color:#fff}.check{display:block;width:min(100%,520px);margin:0 auto;padding:14px;border-radius:16px;background:var(--good);color:white;font-size:20px;font-weight:800}.check:disabled{background:#b9c1d6}.result h2{font-size:30px}.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.stat{background:#f3f6fb;border-radius:12px;padding:10px;font-weight:700}.small{color:var(--muted);font-size:14px}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ffb703;outline-offset:2px}@media(max-width:500px){.card{padding:16px}.keys{grid-template-columns:repeat(4,1fr)}.top{gap:5px}}
</style>
</head>
<body><main class="wrap">
<a class="home" href="../index.html">🏠 חזרה לכל המשחקים</a>
<section id="setup" class="card center">
  <div class="hero" aria-hidden="true">🐷🪙</div><h1 class="title">כמה כסף יש לי?</h1><p class="sub">סופרים מטבעות ומגלים כמה כסף יש בארנק. במשחק 10 שאלות ו־5 לבבות.</p>
  <div class="label">איך קוראים לך? (לא חובה)</div><input id="kidName" class="input" maxlength="20" autocomplete="off" placeholder="השם שלי">
  <div class="label">מה נתרגל?</div><div class="options" id="modes"><button class="opt on" data-val="mixed" type="button">🔀 מעורב</button><button class="opt" data-val="add" type="button">➕ חיבור</button><button class="opt" data-val="sub" type="button">➖ חיסור</button></div>
  <div class="label">אילו מטבעות?</div><div class="options" id="levels"><button class="opt" data-val="easy" type="button">🙂 קל: 1 ו־2 ₪</button><button class="opt" data-val="medium" type="button">😎 בינוני: עד 5 ₪</button><button class="opt on" data-val="all" type="button">🚀 כל המטבעות</button></div>
  <button id="start" class="start" type="button">יוצאים לדרך! 🚀</button>
</section>
<section id="play" class="card" hidden>
  <div class="top"><button class="icon" id="quit" type="button" aria-label="חזרה להגדרות">✖</button><b id="qcount"></b><span id="hearts" class="hearts" aria-label="לבבות"></span><button class="icon" id="mute" type="button" aria-label="השתקה">🔊</button></div>
  <div class="dots" id="dots" aria-label="התקדמות"></div>
  <div id="bubble" class="bubble" aria-live="polite"></div>
  <div class="board"><div id="wallet" class="wallet">👛 הארנק</div><div id="coins" class="coins"></div><div class="foot"><span id="counter" class="small">👆 אפשר לגעת במטבעות כדי לספור</span><button id="hint" class="hint" type="button">💡 רמז</button></div></div>
  <div class="answerline"><span id="ask">בארנק יש</span><div id="answer" class="answer" aria-live="polite">?</div><span>₪</span></div>
  <div id="keys" class="keys"></div><button id="check" class="check" type="button" disabled>בדיקה ✓</button>
</section>
<section id="result" class="card center result" hidden><div class="hero">🐷🎉</div><h2 id="resultTitle">כל הכבוד!</h2><p id="resultText" class="sub"></p><div id="stats" class="stats"></div><button id="again" class="start" type="button">משחקים שוב 🔄</button></section>
</main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), TOTAL=10, MAX_MISTAKES=5, MAX_ANSWER=15, VALUES={easy:[1,2],medium:[1,2,5],all:[1,2,5,10]};
let mode='mixed',level='all',name='',muted=false,questions=[],index=0,mistakes=0,selected=null,counted=[],solved=0,firstTry=0,wrongOnQuestion=0,hintUsed=false,history=[],questionLocked=false;
const pick=a=>a[Math.floor(Math.random()*a.length)],sum=a=>a.reduce((x,y)=>x+y,0);
function options(id,cb){$(id).addEventListener('click',e=>{const b=e.target.closest('[data-val]');if(!b)return;$(id).querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.val)})}
options('#modes',v=>mode=v);options('#levels',v=>level=v);
function makeRound(){
  const values=VALUES[level], combinations=[];
  function build(start,coins,total){
    if(coins.length>=3)combinations.push(coins.slice());
    if(coins.length===5)return;
    for(let i=start;i<values.length;i++){
      const value=values[i];if(total+value>MAX_ANSWER)continue;
      coins.push(value);build(i,coins,total+value);coins.pop();
    }
  }
  build(0,[],0);
  const addPool=combinations.map(coins=>({type:'add',coins,removed:[],answer:sum(coins)}));
  const subPool=[];
  combinations.forEach(coins=>{
    for(let i=0;i<coins.length;i++){
      for(let j=i;j<coins.length;j++){
        if(j===i&&coins.filter(v=>v===coins[i]).length<1)continue;
        const removed=j===i?[coins[i]]:[coins[i],coins[j]],answer=sum(coins)-sum(removed);
        if(answer>0)subPool.push({type:'sub',coins,removed,answer});
      }
    }
  });
  const types=Array.from({length:TOTAL},(_,i)=>mode==='mixed'?(i%2===0?'add':'sub'):mode);
  const pools={add:addPool,sub:subPool};
  const qs=types.map(type=>{const q=pick(pools[type]);return {...q,coins:q.coins.slice(),removed:q.removed.slice()}});
  // In the all-coins setting, guarantee that every denomination appears each round.
  // Prefer addition questions so children can practice adding the 10-shekel coin too.
  if(level==='all'){
    const reserved=new Set();
    for(const value of values){
      let slots=qs.map((q,i)=>({q,i})).filter(x=>!reserved.has(x.i)&&x.q.type==='add');
      let pool=addPool.filter(q=>q.coins.includes(value));
      if(!slots.length||!pool.length){slots=qs.map((q,i)=>({q,i})).filter(x=>!reserved.has(x.i)&&pools[x.q.type].some(c=>c.coins.includes(value)));}
      if(slots.length&&pool.length){const slot=pick(slots).i,q=pick(pool);qs[slot]={...q,coins:q.coins.slice(),removed:q.removed.slice()};reserved.add(slot)}
      else if(slots.length){const slot=pick(slots).i,q=pick(pools[qs[slot].type].filter(c=>c.coins.includes(value)));qs[slot]={...q,coins:q.coins.slice(),removed:q.removed.slice()};reserved.add(slot)}
    }
  }
  return qs;
}
function start(){name=$('#kidName').value.trim().slice(0,20);questions=makeRound();index=mistakes=solved=firstTry=0;history=[];$('#setup').hidden=true;$('#result').hidden=true;$('#play').hidden=false;render()}
function renderDots(){$('#dots').innerHTML=questions.map((_,i)=>`<span class="dot ${i===index?'current':history[i]?'done':''}">${history[i]?'✓':i+1}</span>`).join('')}
function render(){const q=questions[index];selected=null;counted=[];wrongOnQuestion=0;hintUsed=false;questionLocked=false;$('#qcount').textContent=`שאלה ${index+1} מתוך ${TOTAL}`;$('#hearts').textContent='❤️'.repeat(MAX_MISTAKES-mistakes)+'🤍'.repeat(mistakes);$('#wallet').textContent=q.type==='sub'?'👛 הארנק — קנינו משהו ושילמנו במטבעות המסומנים':'👛 הארנק';$('#ask').textContent=q.type==='sub'?'בארנק נשארו':'בארנק יש';$('#bubble').textContent=q.type==='sub'?'המטבעות האפורים הם אלה ששילמנו. כמה נשאר?':'כמה כסף יש בארנק? געו במטבעות כדי לספור!';$('#coins').innerHTML=q.coins.map((v,i)=>`<button class="coin ${v===10?'gold':''}" data-i="${i}" type="button" aria-label="מטבע של ${v} שקלים">${v}<small>₪</small></button>`).join('');
  const spentLeft=q.removed.slice();[...$('#coins').children].forEach((el,i)=>{const v=q.coins[i],at=spentLeft.indexOf(v);if(at!==-1){el.classList.add('spent');el.setAttribute('aria-label',`מטבע של ${v} שקלים – שולם`);spentLeft.splice(at,1)}});
  $('#coins').onclick=e=>{const b=e.target.closest('.coin');if(!b||questionLocked||b.classList.contains('spent'))return;const i=+b.dataset.i;if(counted.includes(i))counted=counted.filter(x=>x!==i);else counted.push(i);b.classList.toggle('counted',counted.includes(i));$('#counter').textContent=counted.length?`סופרים: ${sum(counted.map(k=>q.coins[k]))} ₪`:'👆 אפשר לגעת במטבעות כדי לספור'};
  $('#counter').textContent='👆 אפשר לגעת במטבעות כדי לספור';$('#answer').textContent='?';$('#check').disabled=true;$('#hint').disabled=false;$('#keys').innerHTML='';for(let n=1;n<=MAX_ANSWER;n++){const b=document.createElement('button');b.className='key';b.textContent=n;b.type='button';b.setAttribute('aria-label',`${n} שקלים`);b.onclick=()=>{if(questionLocked)return;selected=n;$('#answer').textContent=n;$('#keys').querySelectorAll('.key').forEach(k=>k.classList.toggle('sel',+k.textContent===n));$('#check').disabled=false};$('#keys').appendChild(b)}renderDots()}
function speak(text){if(muted||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='he-IL';speechSynthesis.speak(u)}catch(_){}}
function check(){if(selected==null||questionLocked)return;const q=questions[index];if(selected===q.answer){questionLocked=true;solved++;if(!wrongOnQuestion)firstTry++;history[index]=true;$('#bubble').textContent=`${name?name+', ':''}כל הכבוד! התשובה היא ${q.answer} שקלים 🎉`;speak(`כל הכבוד! התשובה היא ${q.answer} שקלים`);$('#check').disabled=true;setTimeout(()=>{if(mistakes>=MAX_MISTAKES||index+1>=TOTAL)finish();else{index++;render()}},900)}else{wrongOnQuestion++;mistakes++;$('#hearts').textContent='❤️'.repeat(Math.max(0,MAX_MISTAKES-mistakes))+'🤍'.repeat(Math.min(MAX_MISTAKES,mistakes));$('#bubble').textContent=mistakes>=MAX_MISTAKES?'נגמרו הלבבות — לא נורא, טעויות עוזרות ללמוד!':'כמעט! בדקו את המטבעות ונסו שוב 💪';speak($('#bubble').textContent);if(mistakes>=MAX_MISTAKES){questionLocked=true;setTimeout(finish,1100)}else{selected=null;$('#answer').textContent='?';$('#check').disabled=true;$('#keys').querySelectorAll('.key').forEach(k=>k.classList.remove('sel'))}}}
function hint(){if(hintUsed||questionLocked)return;hintUsed=true;const q=questions[index];$('#hint').disabled=true;$('#bubble').textContent=q.type==='sub'?'רמז: סופרים רק את המטבעות שלא שולמו. נסו לחבר אותם.':'רמז: התחילו מהמטבע הגדול והוסיפו את המטבעות הקטנים.';speak($('#bubble').textContent)}
function finish(){const score=Math.max(0,firstTry*10+(solved-firstTry)*5);$('#play').hidden=true;$('#result').hidden=false;$('#resultTitle').textContent=mistakes>=MAX_MISTAKES?'לא נורא, ממשיכים ללמוד!':'כל הכבוד על המשחק!';$('#resultText').textContent=`${name?name+', ':''}${mistakes>=MAX_MISTAKES?'הגעתם עד שאלה '+(index+1)+' ולמדתם בדרך.':'סיימתם את כל השאלות.'}`;$('#stats').innerHTML=`<span class="stat">✅ ${solved} נפתרו</span><span class="stat">🌟 ${firstTry} בניסיון ראשון</span><span class="stat">⭐ ציון ${score}</span>`}
$('#start').onclick=start;$('#again').onclick=()=>{$('#result').hidden=true;$('#setup').hidden=false};$('#check').onclick=check;$('#hint').onclick=hint;$('#quit').onclick=()=>{if(confirm('לחזור להגדרות? ההתקדמות לא תישמר.')){$('#play').hidden=true;$('#setup').hidden=false}};$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';if(muted&&'speechSynthesis'in window)speechSynthesis.cancel()};document.addEventListener('keydown',e=>{if($('#play').hidden)return;if(/^[1-9]$/.test(e.key))$('#keys').children[+e.key-1]?.click();else if(e.key==='Enter')check()});
})();
</script></body></html>
